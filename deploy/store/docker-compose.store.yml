# The centre on the store's Ubuntu PC, beside the store edge, until the external server exists
# (ADR-0186; docs/runbooks/store-install.md). One box, LAN-only HTTP: nothing here is reachable
# from the internet. Images are built on the box from this checkout, as the edge's are.
#
#   bash deploy/store/setup.sh        builds, provisions, migrates, starts (safe to run again)
#
# Staff open http://<this PC's LAN address>:${STORE_HTTP_PORT}; the tills keep port 7400 of the
# edge stack (deploy/edge). Secrets live in deploy/store/.env (gitignored, written by setup.sh).
name: bto-store

x-app: &app
  build:
    context: ../..
    dockerfile: apps/api/Dockerfile
    args:
      GIT_SHA: ${APP_VERSION:-local}
  image: bto-api:store-local
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  # Uploaded files (product pictures, import sheets, the apps' APKs): one volume for api and
  # worker (ADR-0036 #1).
  volumes: ['storage:/data/storage']
  logging: &logging
    driver: json-file
    options: { max-size: '10m', max-file: '5' }

# What both processes read. Each variable is named here, so a container never sees the database
# superuser's password or a secret of the other stack.
x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in deploy/store/.env}@postgres:5432/bto
  PGBOSS_POOL_MAX: '2'
  STORAGE_DRIVER: local
  STORAGE_LOCAL_DIR: /data/storage

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/store/.env}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale-provider=icu --icu-locale=und'
    # The defaults are sized for a 7 GB box shared with the edge stack: a quarter of what PostgreSQL
    # may use goes to shared_buffers, and 40 connections cover the default pool budget below (15)
    # with room for the migrator, the nightly dump, the seed and psql. A bigger PC raises them in
    # deploy/store/.env (ADR-0191, architecture §10.7): STORE_PG_* here, STORE_API_* and
    # STORE_WORKER_* below; max_connections must stay above the sum of the pools.
    command:
      - postgres
      - -c
      - shared_buffers=${STORE_PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${STORE_PG_EFFECTIVE_CACHE:-2GB}
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=${STORE_PG_MAX_CONNECTIONS:-40}
      - -c
      - wal_compression=on
      - -c
      - max_wal_size=2GB
      - -c
      - checkpoint_timeout=15min
    # postgres 18+ images keep PGDATA under /var/lib/postgresql/18/docker; mount the parent.
    volumes: ['pg:/var/lib/postgresql']
    # Loopback only: the seed over an SSH tunnel and psql on the box. Never the LAN.
    ports: ['127.0.0.1:${STORE_PG_PORT:-15433}:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    shm_size: 256mb
    mem_limit: ${STORE_PG_MEMORY:-1536m}
    logging: *logging

  api:
    <<: *app
    environment:
      <<: *app-env
      ROLE: api
      # Pool budget (docs/architecture.md §10.2): api 6 + 1 live stock listener, pg-boss 2, the
      # AI reader 2. A long report holds a connection for its whole run: when every one is busy,
      # other requests wait 5 s and fail (the load test of 2026-11-13), so a bigger PC gives more.
      DB_POOL_MAX: '${STORE_API_DB_POOL_MAX:-6}'
      AI_POOL_MAX: '2'
      MIGRATOR_DATABASE_URL: postgres://migrator:${MIGRATOR_DB_PASSWORD:?set MIGRATOR_DB_PASSWORD in deploy/store/.env}@postgres:5432/bto
      AI_DATABASE_URL: postgres://ai_reader:${AI_DB_PASSWORD:?set AI_DB_PASSWORD in deploy/store/.env}@postgres:5432/bto
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/store/.env}
      AUTH_PEPPER: ${AUTH_PEPPER:?set AUTH_PEPPER in deploy/store/.env}
      # The tills' PIN key (ADR-0063 #6): the centre hands it to the edge at the link (ADR-0136 #4).
      POS_PIN_PEPPER: ${POS_PIN_PEPPER:?set POS_PIN_PEPPER in deploy/store/.env}
      # Plain HTTP on the store's LAN: a Secure cookie would never come back.
      COOKIE_SECURE: 'false'
      # The AI assistant (ADR-0045, ADR-0162): the key is typed on «Тохиргоо → AI» and sealed with
      # AI_KEY_SECRET; LLM_* stay empty unless the owner sets them here.
      AI_KEY_SECRET: ${AI_KEY_SECRET:?set AI_KEY_SECRET in deploy/store/.env}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
    # Node takes about half of the limit as its heap.
    mem_limit: ${STORE_API_MEMORY:-1024m}
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    <<: *app
    environment:
      <<: *app-env
      ROLE: worker
      # worker 2 + pg-boss 2; health on loopback only, no published port.
      DB_POOL_MAX: '${STORE_WORKER_DB_POOL_MAX:-2}'
    mem_limit: ${STORE_WORKER_MEMORY:-768m}
    depends_on:
      postgres: { condition: service_healthy }
      api: { condition: service_healthy }

  # The admin's pages and the way in to the api: the web image with this stack's Caddyfile.
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    image: bto-web:store-local
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    volumes: ['./Caddyfile.store:/etc/caddy/Caddyfile:ro']
    environment:
      # The name the staff app and the office's web use from outside (ADR-0188, ADR-0189); none = a
      # name no request carries. Only callers from these countries are answered under it.
      STORE_PUBLIC_HOST: ${STORE_PUBLIC_HOST:-outside.invalid}
      STORE_PUBLIC_COUNTRIES: ${STORE_PUBLIC_COUNTRIES:-MN}
    # Every interface of the box: the store's LAN. The router forwards nothing to it; the outside
    # name arrives through `cloudflared` on this PC.
    ports: ['${STORE_HTTP_PORT:-80}:80']
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:80/']
      interval: 30s
      timeout: 3s
      retries: 3
    mem_limit: 128m
    logging: *logging

  # One-off: roles app, migrator and ai_reader, the ICU database, grants (idempotent). Run by
  # setup.sh as `docker compose run --rm provision`; the only container that sees the superuser.
  provision:
    <<: *app
    profiles: [tools]
    restart: 'no'
    command: ['node', 'dist/db/provision.js']
    environment:
      NODE_ENV: production
      ADMIN_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
      DATABASE_URL: postgres://app:${APP_DB_PASSWORD}@postgres:5432/bto
      MIGRATOR_DATABASE_URL: postgres://migrator:${MIGRATOR_DB_PASSWORD}@postgres:5432/bto
      AI_DATABASE_URL: postgres://ai_reader:${AI_DB_PASSWORD}@postgres:5432/bto
    depends_on:
      postgres: { condition: service_healthy }

  # One-off: the migrations alone, without starting the api (the seed needs a database that was
  # migrated and never started). The api applies them again at every start, which is then a no-op.
  migrate:
    <<: *app
    profiles: [tools]
    restart: 'no'
    command: ['node', 'dist/db/migrate.js']
    environment:
      NODE_ENV: production
      MIGRATOR_DATABASE_URL: postgres://migrator:${MIGRATOR_DB_PASSWORD}@postgres:5432/bto
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pg: {}
  storage: {}
