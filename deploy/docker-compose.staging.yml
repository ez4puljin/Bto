# Staging stack on the same droplet, with its own PostgreSQL container (never the managed cluster).
# On the droplet (/opt/tugeel):  docker compose -f docker-compose.staging.yml --env-file .env.staging up -d
name: tugeel-staging

x-app: &app
  image: ghcr.io/ez4puljin/bto-api:${API_TAG:?API_TAG is required}
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  env_file: [.env.staging]
  # Uploaded files (product images, import sheets): one volume for api and worker (ADR-0036 #1).
  volumes: ['storage_staging:/data/storage']
  logging: &logging
    driver: json-file
    options: { max-size: '10m', max-file: '3' }

services:
  postgres-staging:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale-provider=icu --icu-locale=und'
    # postgres 18+ images keep PGDATA under /var/lib/postgresql/18/docker; mount the parent.
    volumes: ['pg_staging:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 30
    shm_size: 256mb
    mem_limit: 512m
    networks: [default]
    logging: *logging

  api-staging:
    <<: *app
    environment: { ROLE: api, DB_POOL_MAX: '2', PGBOSS_POOL_MAX: '2' }
    networks: [default, edge_staging]
    mem_limit: 512m
    depends_on:
      postgres-staging: { condition: service_healthy }

  worker-staging:
    <<: *app
    environment: { ROLE: worker, DB_POOL_MAX: '2', PGBOSS_POOL_MAX: '2' }
    networks: [default]
    mem_limit: 512m
    depends_on:
      postgres-staging: { condition: service_healthy }
      api-staging: { condition: service_healthy }

  web-staging:
    image: ghcr.io/ez4puljin/bto-web:${WEB_TAG:?WEB_TAG is required}
    restart: unless-stopped
    networks: [edge_staging]
    logging: *logging

networks:
  edge_staging: { name: tugeel_edge_staging, external: true }

volumes:
  storage_staging: {}
  pg_staging: {}
