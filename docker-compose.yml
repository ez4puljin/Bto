# Local development only (docs/architecture.md §10.1). Staging/production stacks live in deploy/.
name: tugeel
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # local superuser; the port is bound to 127.0.0.1 only
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale-provider=icu --icu-locale=und'
    command: ['postgres', '-c', 'max_connections=200']
    # 15432: below the Windows dynamic port range and away from a native PostgreSQL on 5432.
    ports: ['127.0.0.1:15432:5432']
    # postgres 18+ images keep PGDATA under /var/lib/postgresql/18/docker; mount the parent.
    volumes: ['pgdata:/var/lib/postgresql']
    shm_size: 256mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d postgres']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
volumes:
  pgdata:
